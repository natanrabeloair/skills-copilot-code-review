name: Create Copilot review ruleset

# One-shot helper so Step 4 can see an active ruleset named for Copilot reviews.
# Safe to remove after the ruleset exists.
on:
  push:
    branches:
      - copilot/fix-code-review-issues

permissions:
  administration: write
  contents: read

jobs:
  create-ruleset:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Require Copilot Reviews ruleset exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          echo "Listing rulesets"
          if ! names=$(gh api "repos/${REPO}/rulesets" --jq '.[].name'); then
            echo "Unable to list rulesets"
            exit 1
          fi
          echo "Existing rulesets:"
          echo "${names:-<none>}"
          if echo "$names" | grep -i -e copilot -e review; then
            echo "Matching ruleset already exists"
            exit 0
          fi

          create_ruleset() {
            local payload="$1"
            echo "POST ruleset payload:"
            echo "$payload"
            gh api --method POST "repos/${REPO}/rulesets" --input - <<<"$payload"
          }

          pull_request='{"type":"pull_request","parameters":{"required_approving_review_count":0,"dismiss_stale_reviews_on_push":false,"require_code_owner_review":false,"require_last_push_approval":false,"required_review_thread_resolution":true}}'
          base='{"name":"Require Copilot Reviews","target":"branch","enforcement":"active","conditions":{"ref_name":{"include":["~DEFAULT_BRANCH","refs/heads/main"],"exclude":[]}}}'

          payload1=$(jq -n --argjson base "$base" --argjson pr "$pull_request" '$base + {rules: [$pr, {type: "copilot_code_review", parameters: {review_on_push: false, review_draft_pull_requests: false}}]}')
          if create_ruleset "$payload1"; then
            echo "Created ruleset with copilot_code_review rule"
            exit 0
          fi

          payload2=$(jq -n --argjson base "$base" --argjson pr "$pull_request" '$base + {rules: [($pr | .parameters.automatic_copilot_code_review_enabled = true)]}')
          if create_ruleset "$payload2"; then
            echo "Created ruleset with automatic copilot review parameter"
            exit 0
          fi

          payload3=$(jq -n --argjson base "$base" --argjson pr "$pull_request" '$base + {rules: [$pr]}')
          if create_ruleset "$payload3"; then
            echo "Created ruleset with pull request and conversation resolution rules"
            exit 0
          fi

          echo "Failed to create ruleset"
          exit 1
